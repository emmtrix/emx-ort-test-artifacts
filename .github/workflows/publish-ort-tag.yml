name: Publish ORT Tag

# Creates the `ort-v<version>` tag for the ONNX Runtime version currently
# pinned in requirements.txt.
#
# The workflow only listens on pushes to `main`, so a tag can never be created
# from a pull request branch: it appears exactly when the version bump has been
# squash-merged, and it points at that merge commit. The job is idempotent and
# creates no GitHub release - pushes that do not advance the pin find the tag
# already present and exit without doing anything.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-ort-tag
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Read pinned ONNX Runtime version
        id: pin
        run: |
          version="$(PYTHONPATH=tools/python python -c '
          from pathlib import Path

          from emx_ort_test_materializer.onnxruntime_source import read_pinned_onnxruntime_version

          print(read_pinned_onnxruntime_version(Path("requirements.txt")))
          ')"
          echo "tag=ort-v${version}" >> "${GITHUB_OUTPUT}"
          echo "Pinned ONNX Runtime version: ${version}"

      - name: Create tag for the pinned version
        env:
          TAG: ${{ steps.pin.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists. Nothing to do."
            exit 0
          fi

          git tag "${TAG}" "${GITHUB_SHA}"
          git push origin "refs/tags/${TAG}"
          echo "Created tag ${TAG} at ${GITHUB_SHA}."
